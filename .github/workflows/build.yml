name: Compilar y probar

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Pruebas
        run: dotnet test tests/Karaoke.Core.Tests/Karaoke.Core.Tests.csproj --configuration Release
      - name: Publicar win-x86
        run: dotnet publish src/Karaoke.App/Karaoke.App.csproj -c Release -r win-x86 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish/win-x86
      - name: Publicar win-x64
        run: dotnet publish src/Karaoke.App/Karaoke.App.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish/win-x64
      - uses: actions/upload-artifact@v4
        with:
          name: KaraokeInteractivo-win-x86
          path: publish/win-x86
      - uses: actions/upload-artifact@v4
        with:
          name: KaraokeInteractivo-win-x64
          path: publish/win-x64
